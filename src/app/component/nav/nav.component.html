<nav class="c-navbar navbar navbar-expand-lg navbar-light bg-white ">
  <div class="c-container d-flex align-items-center justify-content-between">

    <!-- Apple Icon (Mobile) -->
    <a class="navbar-brand m-0 d-lg-none" href="#">
      <i class="bi bi-apple fs-4"></i>
    </a>

    <!-- Right Icons (Mobile) -->
    <div class="d-flex d-lg-none align-items-center gap-3">
      <button class="btn btn-link text-dark p-0">
        <i class="bi bi-search fs-5"></i>
      </button>

      <!-- Hamburger -->
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#appleNav"
        aria-controls="appleNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>

    <!-- Desktop + Mobile Menu -->
    <div class="collapse navbar-collapse mobile-menu" id="appleNav">
      <ul
        class="nav d-flex justify-content-between align-items-center flex-nowrap w-100 m-0"
      >
        <!-- Apple Icon (Desktop) -->
        <li class="d-none d-lg-block">
          <a class="navbar-brand" href="#">
            <i class="bi bi-apple fs-4"></i>
          </a>
        </li>

        <!-- Links -->
        <li class="nav-item" *ngFor="let item of navItems">
          <a class="nav-link" [href]="item.href">
            {{ item.label }}
          </a>
        </li>

        <!-- Search (Desktop) -->
        <li class="d-none d-lg-block">
          <button class="btn btn-link text-dark p-0">
            <i class="bi bi-search"></i>
          </button>
        </li>
      </ul>
    </div>

  </div>
</nav>
